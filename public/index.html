<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мої лічильники</title>
<meta name="theme-color" content="#E9EDF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column of a "meter board" — reminder strip on top, meter cards in a responsive grid, sheets slide over */
:root{
  color-scheme:light;
  --bg:#E9EDF1; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#14202C; --muted:#5A6774; --line:#D5DCE3;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --tg:#2AABEE;
  --ok:#1F7A4D; --ok-bg:#E2F3EA; --warn:#A65F00; --warn-bg:#FDF0D9; --bad:#B42318; --bad-bg:#FDE6E3;
  --drum:#1B232C; --drum-ink:#F3F5F7; --drum-red:#D92D20;
  --elec:#E0A100; --gas:#2F6FEB; --water:#0E9AA7; --heat:#D9480F;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#0E131A; --surface:#161D26; --surface-2:#1C2530; --ink:#E6EBF0; --muted:#94A2B0; --line:#2A3542;
  --accent:#6E9BFF; --accent-ink:#0B1220; --tg:#4CC0F5;
  --ok:#5CCB91; --ok-bg:#16301F; --warn:#F2B451; --warn-bg:#33270F; --bad:#FF8A7A; --bad-bg:#3A1A17;
  --drum:#0A0E13; --drum-ink:#F3F5F7; --drum-red:#FF5A4A;
  --elec:#F5C04A; --gas:#6E9BFF; --water:#3CC8D2; --heat:#FF7A45}}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:18px}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
header.top .when{display:flex;flex-direction:column;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s;text-decoration:none;color:inherit}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.tg{background:var(--tg);color:#04121b;border-color:var(--tg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}

.remind{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.remind.alert{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.remind.overdue{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.remind .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.remind ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.remind li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.card .row .name{min-width:min(100%,13em)}
.name{display:flex;gap:10px;align-items:center;min-width:0}
.name > div{min-width:0}
.name h3,.name h2{overflow-wrap:break-word;hyphens:auto}
.badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.badge svg{width:18px;height:18px}
.t-elec{background:var(--elec);color:#1a1300} .t-gas{background:var(--gas)} .t-water{background:var(--water)} .t-heat{background:var(--heat)} .t-other{background:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.idle{background:var(--surface-2);color:var(--muted)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

.odo{display:inline-flex;gap:3px;padding:6px;background:var(--drum);border-radius:8px;font-family:var(--f-mono);font-weight:700;font-size:22px;line-height:1;max-width:100%;overflow-x:auto}
.odo span{display:inline-grid;place-items:center;width:1.05em;height:1.45em;background:linear-gradient(180deg,#000 0%,#2b333c 18%,#3a434d 50%,#2b333c 82%,#000 100%);color:var(--drum-ink);border-radius:3px}
.odo span.red{background:linear-gradient(180deg,#3d0905 0%,#8c1c13 18%,var(--drum-red) 50%,#8c1c13 82%,#3d0905 100%);color:#fff}
.odo span.blank{color:#5b6570}
.odo-wrap{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.odo-wrap .unit{font-size:13px;color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 22px;display:flex;flex-direction:column;gap:16px}
.empty p{max-width:60ch}
.tpls{display:flex;flex-wrap:wrap;gap:8px}

.overlay{position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:20;display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{font-family:var(--f-mono);font-size:13px;min-height:120px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.hint{font-size:12px;color:var(--muted)}
.hint code{font-family:var(--f-mono);background:var(--surface-2);padding:0 4px;border-radius:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.two{grid-template-columns:1fr}}
.big input{font-family:var(--f-mono);font-size:28px;font-weight:700;padding:12px 14px;letter-spacing:.04em}
.calc{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.calc b{font-weight:600;text-align:right}
.note-warn{color:var(--warn);font-size:13px;font-weight:500}
.form-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{padding:0 6px;font-weight:600;font-size:14px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.copybox{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.copybox code{flex:1 1 220px;min-width:0;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere;user-select:all}

/* chat-like transcript of a bot run */
.log{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;font-size:14px}
.log .m{max-width:85%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.log .me{align-self:flex-end;background:var(--tg);color:#04121b;border-bottom-right-radius:4px}
.log .bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.log .sys{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.log .sys.bad{color:var(--bad);font-weight:600}
.log .sys.ok{color:var(--ok);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:40;max-width:calc(100% - 32px)}
footer{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="when">
      <span class="eyebrow" id="today"></span>
      <h1>Мої лічильники</h1>
    </div>
    <div class="actions">
      <button class="btn" id="tg-btn"><span class="dot" id="tg-dot"></span>Telegram</button>
      <button class="btn" id="ics-btn">Нагадування в календар</button>
      <button class="btn primary" id="add-meter">+ Лічильник</button>
    </div>
  </header>

  <section class="remind" id="remind" aria-live="polite"></section>
  <section id="board"></section>

  <footer>
    <span>Дані зберігаються лише в цьому браузері</span>
    <span><button class="lnk" id="backup">Резервна копія</button> · <button class="lnk" id="restore">Відновити</button><input type="file" id="restore-file" accept="application/json" hidden></span>
  </footer>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
