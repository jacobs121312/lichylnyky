<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лічильники</title>
<meta name="theme-color" content="#ECEEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0E10" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1418'/%3E%3Cpath d='M8 21a8 8 0 1 1 16 0' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 21l4.5-6' stroke='%23F2B705' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: "household meter board" — a task-first hero (what to do now), a month schedule of submission
   windows, then one card per meter. Colour is reserved for resource types; everything else is ink on paper. */
:root{
  color-scheme:light;
  --bg:#ECEEE9; --paper:#FFFFFF; --sunk:#F4F5F2; --ink:#0F1418; --ink-2:#3B444B; --muted:#6A737A; --line:#DCDFD9; --line-2:#C9CDC6;
  --on-ink:#FFFFFF; --tg:#2AABEE; --focus:#3D6BFF;
  --ok:#17784A; --ok-bg:#DFF2E7; --warn:#9A5B00; --warn-bg:#FBEFD6; --bad:#B42318; --bad-bg:#FCE4E1;
  --elec:#F2B705; --gas:#3D6BFF; --water:#00A0B2; --heat:#F2542D; --other:#7B848B;
  --drum:#14191E; --drum-face:#F4F5F2; --drum-red:#E0362B;
  --f-display:"Geologica","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:22px; --r:16px; --r-sm:10px;
  --shadow:0 1px 0 rgba(15,20,24,.04),0 8px 24px -12px rgba(15,20,24,.18);
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#0B0E10; --paper:#14181B; --sunk:#1A1F23; --ink:#ECEFEA; --ink-2:#BFC6C2; --muted:#8B959B; --line:#252B30; --line-2:#323A40;
  --on-ink:#0B0E10; --tg:#4CC0F5; --focus:#7D9BFF;
  --ok:#5ACB8F; --ok-bg:#12291C; --warn:#F2B451; --warn-bg:#2E2410; --bad:#FF8A7A; --bad-bg:#361815;
  --elec:#F5C53A; --gas:#7D9BFF; --water:#36C3D1; --heat:#FF7A52; --other:#8B959B;
  --drum:#06080A; --drum-face:#E9ECE8; --drum-red:#FF5A4A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
}}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11"}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-display);letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

.wrap{max-width:1120px;margin:0 auto;padding-block:20px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
@media (min-width:900px){.wrap{padding-block:32px 72px;gap:24px}}

/* ---------- header ---------- */
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:22px;font-weight:700;line-height:1.1}
.brand .eyebrow{display:block;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{--bh:40px;height:var(--bh);border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:0 16px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .1s;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ink{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.ink:hover:not(:disabled){opacity:.9}
.btn.tg{background:var(--tg);color:#03131c;border-color:var(--tg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--sunk);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{--bh:34px;padding:0 13px;font-size:13px}
.btn.icon{width:var(--bh);padding:0}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm svg{width:16px;height:16px}
.chip-status{display:inline-flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:inline-block;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.lnk{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;white-space:nowrap;line-height:1.2}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.idle{background:var(--sunk);color:var(--muted)}

/* resource swatch */
.res{--c:var(--other);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.res svg{width:18px;height:18px}
.res.sm{width:28px;height:28px;border-radius:9px}
.res.sm svg{width:15px;height:15px}
.r-elec{--c:var(--elec)} .r-gas{--c:var(--gas)} .r-water{--c:var(--water)} .r-heat{--c:var(--heat)} .r-other{--c:var(--other)}

/* ---------- hero: what to do now ---------- */
.hero{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr;overflow:hidden}
@media (min-width:900px){.hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.hero .now{padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:900px){.hero .now{padding:30px 32px}}
.hero h2{font-size:clamp(26px,4.2vw,40px);font-weight:700;line-height:1.05;letter-spacing:-.025em}
.hero h2 em{font-style:normal;color:var(--muted)}
.hero .sub{color:var(--ink-2);font-size:15px;max-width:52ch}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.todo li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.todo .t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.todo .t-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .t-main > span{font-size:13px;color:var(--muted)}
@media (max-width:560px){.todo .wide{display:none}}
.hero .bill{background:var(--sunk);padding:24px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);min-width:0}
@media (min-width:900px){.hero .bill{padding:30px 28px;border-top:0;border-left:1px solid var(--line)}}
.bill .big{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
.bill .big small{font-size:18px;color:var(--muted);font-weight:500}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--line)}
.stack i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.legend li{display:flex;align-items:center;gap:10px}
.legend li span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}

/* ---------- schedule: submission windows across the month ---------- */
.panel{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 20px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){.panel{padding:24px 28px 20px}}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:18px;font-weight:600}
.sched{display:grid;grid-template-columns:minmax(84px,150px) 1fr;column-gap:14px;row-gap:8px;align-items:center}
.sched .lbl{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.sched .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:28px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--sunk) 0 calc(100%/var(--days) - 1px),var(--paper) calc(100%/var(--days) - 1px) calc(100%/var(--days)))}
.track .win{position:absolute;top:4px;bottom:4px;border-radius:6px;background:color-mix(in srgb,var(--c) 26%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent)}
.track .win.done{background:color-mix(in srgb,var(--c) 70%,transparent);border-color:transparent}
.track .mark{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink);border:2px solid var(--paper)}
.days{position:relative;height:18px;font-size:11px;color:var(--muted)}
.days span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.days span.today{color:var(--ink);font-weight:700}
.today-line{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px;pointer-events:none;z-index:1}
.sched-key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sched-key span{display:inline-flex;align-items:center;gap:6px}
.sched-key i{display:inline-block;width:16px;height:10px;border-radius:3px}

/* ---------- meter cards ---------- */
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 4px 0}
.section-head h2{font-size:18px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.card{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;position:relative}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card .name{display:flex;gap:12px;align-items:center;min-width:min(100%,13em);flex:1}
.card .name > div{min-width:0}
.card h3{font-size:16.5px;font-weight:600;line-height:1.25;overflow-wrap:break-word}
.card .prov{font-size:13px;color:var(--muted)}
.reading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.reading > div{min-width:0;display:flex;align-items:flex-end;flex-wrap:wrap}
.reading .unit{font-size:12.5px;color:var(--muted);margin-left:6px}
.spark{width:84px;height:34px;flex:none;display:block}
@media (max-width:380px){.spark{display:none}}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:10px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts div + div{padding-left:12px;border-left:1px solid var(--line)}
.facts dt{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.facts dd small{font-size:11px;font-weight:500;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.card .meta span{display:inline-flex;align-items:center;gap:5px}
.card .meta svg{width:13px;height:13px}
.card .foot{display:flex;gap:8px;align-items:center;margin-top:auto}
.card .foot .grow{flex:1}

/* ---------- odometer: drums in a plate, red drums for fractions ---------- */
.odo{display:inline-flex;gap:2px;padding:5px;background:var(--drum);border-radius:10px;font-family:var(--f-mono);font-weight:700;font-size:22px;line-height:1;max-width:100%;overflow-x:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.odo span{position:relative;display:inline-grid;place-items:center;width:1.08em;height:1.5em;background:linear-gradient(180deg,#9aa0a3 0%,var(--drum-face) 22%,#fff 50%,var(--drum-face) 78%,#9aa0a3 100%);color:#111;border-radius:3px}
.odo span.red{background:linear-gradient(180deg,#5c0d07 0%,var(--drum-red) 24%,#ff6a5c 50%,var(--drum-red) 76%,#5c0d07 100%);color:#fff}
.odo span.blank{color:#b8bdbf}
.odo span.sep{width:.35em;background:none;color:#8d9396}
.odo.lg{font-size:30px;padding:7px;border-radius:12px;gap:3px}

/* ---------- empty state ---------- */
.empty{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:32px 24px;display:grid;gap:24px}
@media (min-width:900px){.empty{grid-template-columns:1.2fr 1fr;padding:44px 40px;align-items:center}}
.empty h2{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.05;letter-spacing:-.025em}
.empty p{color:var(--ink-2);max-width:52ch}
.steps3{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps3 li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;counter-increment:s}
.steps3 li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:600;font-size:13px}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
.tpl{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-weight:500}
.tpl:hover{border-color:var(--ink-2)}

/* ---------- mobile dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:8px}
.dock .btn{--bh:48px;flex:1;font-size:15px}
@media (min-width:900px){.dock{display:none}}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,11,14,.5);z-index:20;display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top,0px);animation:fade .18s ease-out}
@media (min-width:700px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center;flex:none}
@media (min-width:700px){.sheet{border-radius:24px;padding:24px 28px 28px}.sheet::before{display:none}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet .bar h2{font-size:22px;font-weight:600;line-height:1.15}
.sheet .bar .name{display:flex;gap:12px;align-items:center;min-width:0}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1;flex:none;display:grid;place-items:center}
form.f{display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);background:var(--paper);border-radius:12px;padding:11px 13px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
.fld textarea{font-family:var(--f-mono);font-size:13px;line-height:1.6;min-height:150px;resize:vertical;background:var(--sunk)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 18%,transparent)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.hint code,.code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:5px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.note-warn{color:var(--warn);font-size:13px;font-weight:500;background:var(--warn-bg);padding:10px 12px;border-radius:10px}
.form-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
legend{padding:0 6px;font-weight:600;font-size:14px;font-family:var(--f-display)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* reading entry */
.entry{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px}
.entry input{font-family:var(--f-mono);font-size:34px;font-weight:700;text-align:center;letter-spacing:.06em;border:0;border-bottom:2px solid var(--line-2);border-radius:0;background:transparent;padding:6px 4px;width:100%;max-width:320px}
.entry input:focus{outline:none;border-color:var(--ink)}
.expect{font-size:13px;color:var(--muted);text-align:center}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sunk);border-radius:14px}
.calc div{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.calc div + div{border-left:1px solid var(--line)}
.calc dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.calc dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* scenario preview */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:st}
.steps li{display:grid;grid-template-columns:24px auto 1fr;gap:10px;align-items:center;font-size:13.5px;counter-increment:st;min-width:0}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.steps .op{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.steps .arg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.bot{grid-template-columns:24px 1fr}
.steps li.bot .op{grid-column:2}
.steps li.run::before{background:var(--ink);color:var(--on-ink)}
.steps li.ok::before{content:"✓";background:var(--ok-bg);color:var(--ok)}
.steps li.err::before{content:"!";background:var(--bad-bg);color:var(--bad)}

/* history */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.copybox{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.copybox code{flex:1 1 220px;min-width:0;background:var(--sunk);border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere;user-select:all}

/* bot run transcript, styled after a chat */
.log{background:var(--sunk);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto;font-size:14px}
.log .m{max-width:85%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.log .me{align-self:flex-end;background:var(--tg);color:#03131c;border-bottom-right-radius:5px}
.log .bot{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:5px}
.log .sys{align-self:center;font-size:12px;color:var(--muted);text-align:center;padding:2px 8px}
.log .sys.bad{color:var(--bad);font-weight:600;background:var(--bad-bg);border-radius:8px}
.log .sys.ok{color:var(--ok);font-weight:600;background:var(--ok-bg);border-radius:8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:999px;font-weight:500;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:rise .2s ease-out}
@media (min-width:900px){.toast{bottom:28px}}
footer{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;padding:0 4px}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 32 32"><path d="M7 21a9 9 0 1 1 18 0" fill="none" stroke="var(--on-ink)" stroke-width="2.6" stroke-linecap="round"/><path d="M16 21l5-6.5" stroke="#F2B705" stroke-width="2.6" stroke-linecap="round"/></svg></span>
      <div><span class="eyebrow" id="today"></span><h1>Лічильники</h1></div>
    </div>
    <div class="actions">
      <button class="btn sm chip-status" id="tg-btn"><span class="dot" id="tg-dot"></span>Telegram</button>
      <button class="btn sm icon" id="ics-btn" title="Нагадування в календар" aria-label="Нагадування в календар"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M12 13v4M10 15h4"/></svg></button>
      <button class="btn sm ink" id="add-meter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Лічильник</button>
    </div>
  </header>

  <section id="hero" aria-live="polite"></section>
  <section id="schedule"></section>
  <section id="board"></section>

  <footer>
    <span>Дані зберігаються лише в цьому браузері</span>
    <span><button class="lnk" id="backup">Резервна копія</button> · <button class="lnk" id="restore">Відновити</button><input type="file" id="restore-file" accept="application/json" hidden></span>
  </footer>
</div>

<nav class="dock" id="dock" hidden></nav>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
